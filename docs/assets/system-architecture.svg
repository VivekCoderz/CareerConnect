<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CareerConnect system architecture</title>
  <desc id="desc">Users access the React Vite client, which communicates with the Express API and Firebase. The API connects to MongoDB, Cloudinary, email, AI, and external job sources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#475569;stroke-width:2}.core{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.external{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.text{font-family:Arial,sans-serif;fill:#0f172a;font-size:18px;font-weight:700}.sub{font-family:Arial,sans-serif;fill:#475569;font-size:14px}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.label{font-family:Arial,sans-serif;fill:#475569;font-size:13px}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="text" font-size="26">CareerConnect system architecture</text>
  <rect x="45" y="285" width="175" height="95" rx="12" class="box"/><text x="132" y="322" text-anchor="middle" class="text">Users</text><text x="132" y="347" text-anchor="middle" class="sub">Candidates and employers</text>
  <rect x="320" y="270" width="205" height="125" rx="12" class="core"/><text x="422" y="315" text-anchor="middle" class="text">React + Vite client</text><text x="422" y="340" text-anchor="middle" class="sub">Routes, Redux, Axios</text><text x="422" y="362" text-anchor="middle" class="sub">Firebase client SDK</text>
  <rect x="635" y="260" width="210" height="145" rx="12" class="core"/><text x="740" y="307" text-anchor="middle" class="text">Express API</text><text x="740" y="333" text-anchor="middle" class="sub">Auth, validation, CORS</text><text x="740" y="355" text-anchor="middle" class="sub">Rate limits and routes</text>
  <rect x="965" y="75" width="180" height="72" rx="10" class="external"/><text x="1055" y="106" text-anchor="middle" class="text">Firebase</text><text x="1055" y="129" text-anchor="middle" class="sub">Identity provider</text>
  <rect x="965" y="180" width="180" height="72" rx="10" class="external"/><text x="1055" y="211" text-anchor="middle" class="text">MongoDB</text><text x="1055" y="234" text-anchor="middle" class="sub">Application data</text>
  <rect x="965" y="285" width="180" height="72" rx="10" class="external"/><text x="1055" y="316" text-anchor="middle" class="text">Cloudinary</text><text x="1055" y="339" text-anchor="middle" class="sub">Media storage</text>
  <rect x="965" y="390" width="180" height="72" rx="10" class="external"/><text x="1055" y="421" text-anchor="middle" class="text">Email service</text><text x="1055" y="444" text-anchor="middle" class="sub">OTP delivery</text>
  <rect x="965" y="495" width="180" height="72" rx="10" class="external"/><text x="1055" y="526" text-anchor="middle" class="text">AI and job sources</text><text x="1055" y="549" text-anchor="middle" class="sub">Gemini and listings</text>
  <path d="M220 332 H320" class="line"/><text x="268" y="320" text-anchor="middle" class="label">HTTPS</text>
  <path d="M525 332 H635" class="line"/><text x="580" y="320" text-anchor="middle" class="label">API requests</text>
  <path d="M525 290 C680 110 820 110 965 110" class="line"/><text x="710" y="140" text-anchor="middle" class="label">Sign in</text>
  <path d="M845 287 L965 130" class="line"/><path d="M845 310 H965" class="line"/><path d="M845 335 H965" class="line"/><path d="M845 360 L965 426" class="line"/><path d="M845 385 L965 530" class="line"/>
</svg>
