name: Keep campus API awake

# The campus portal's API (e2job-sandip-api on Render's free plan) sleeps after 15 minutes
# without requests and then takes 30-60 s to answer, which leaves sandip.e2job.com on
# "Opening the portal...". A request every few minutes keeps it awake.
# Scheduled workflows run only from the default branch and GitHub may delay them a little.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the campus API
        run: curl --silent --show-error --max-time 90 --retry 2 --output /dev/null --write-out "%{http_code} in %{time_total}s\n" https://e2job-sandip-api.onrender.com/health
